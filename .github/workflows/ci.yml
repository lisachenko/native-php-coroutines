name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# z-engine tracks one PHP minor per release line; the "8.4.x-dev || 8.5.x-dev"
# constraint lets Composer resolve the line matching each runner's PHP, so the
# suite runs on PHP 8.4 and 8.5 in parallel.
jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run test suite
        run: composer test

  # Layer 1 claims to need no FFI at all. This job is what keeps that claim true.
  #
  # It deliberately does NOT go through the .phpt suite: every .phpt carries its own
  # `--INI--` block with `ffi.enable=1` (the engine-level tests cannot run without it,
  # and FFI cannot be switched on at runtime), so a .phpt child would re-enable FFI
  # and quietly defeat the check. The smoke script is run directly instead, so
  # `ffi.enable=0` genuinely holds for the code under test.
  layer1-no-ffi:
    name: Layer 1 without FFI (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: zend.assertions=1, opcache.jit=off
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Boot Layer 1 with ffi.enable=0
        run: php -d ffi.enable=0 -d opcache.jit=off tests/no-ffi-smoke.php

  static-analysis:
    name: PHPStan (level max, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer phpstan

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer cs:check
